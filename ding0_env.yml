name: ding0_env
channels:
    - conda-forge
dependencies:
    - python = 3.11
    - pip

    # GIS dependencies come from conda-forge, the rest is installed by pip
    # from requirements.txt when ding0 itself is installed
    - geopandas >= 0.14, < 1
    - shapely >= 2.0, < 3
    - pyproj >= 3.4
    - psycopg2

[database_credentials]
# Either set the path of an egon-data configuration file (YAML, as used by
# egon-data and eDisGo); an SSH tunnel is opened if it has a section
# ssh-tunnel. Then the parameters below are not used.
egon_data_config =

# or the parameters of the database
name = name
host: ip_address
port: port
user: username
password: password
